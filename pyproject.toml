[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes"
version = "0.1.0"
description = "Local-first AI knowledge agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # AI / Agent
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "chromadb>=0.5",

    # Document Processing
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3",
    "Pillow>=10.0",

    # MCP
    "mcp>=1.0",

    # Utilities
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
hermes = "hermes.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
