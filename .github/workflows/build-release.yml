name: Build & Release

# Triggered by version tags (v*) or manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  # ── Per-platform build ──────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Newline-separated globs — upload-artifact supports multiple patterns
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_CLI_VERSION: 2.11.2

    steps:
      - uses: actions/checkout@v4

      # ── Python 3.12 ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]" pyinstaller

      # ── Tesseract OCR (platform-specific) ───────────────────────────────
      - name: Install Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install tesseract --yes

      - name: Install Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install tesseract

      - name: Install Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      # Copy Tesseract binaries into packaging/ so the spec file can bundle them
      - name: Bundle Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging\tesseract\win   | Out-Null
          New-Item -ItemType Directory -Force -Path packaging\tesseract\tessdata | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe"                  packaging\tesseract\win\
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata"       packaging\tesseract\tessdata\

      - name: Bundle Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p packaging/tesseract/mac packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/mac/
          for SEARCH_PATH in \
              /usr/local/share/tessdata \
              /opt/homebrew/share/tessdata \
              /usr/share/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on macOS"
            exit 1
          fi

      - name: Bundle Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p packaging/tesseract/linux packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/linux/
          for SEARCH_PATH in \
              /usr/share/tessdata \
              /usr/share/tesseract-ocr/5/tessdata \
              /usr/share/tesseract-ocr/4/tessdata \
              /usr/share/tesseract-ocr/tessdata \
              /usr/share/tesseract-ocr/4.00/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            FOUND=$(find /usr -path '*/tessdata/eng.traineddata' -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" packaging/tesseract/tessdata/
            fi
          fi
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on Linux"
            exit 1
          fi

      # ── Build hermes-server sidecar (PyInstaller) ────────────────────────
      - name: Prebuild cleanup (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\stop-dev-processes.ps1

      - name: Build hermes-server (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        # Use system python — venv not present in CI; pip installed into actions python
        run: .\packaging\scripts\build-backend.ps1 -VenvPython python

      - name: Copy hermes-server to Tauri resources (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\copy-backend-to-resources.ps1

      - name: Build hermes-server (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/build-backend.sh

      - name: Copy hermes-server to Tauri resources (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/copy-backend-to-resources.sh

      - name: Repair Linux sidecar shared libs for AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          INTERNAL_DIR="src-tauri/resources/hermes-server/_internal"
          if [ ! -d "$INTERNAL_DIR" ]; then
            echo "No sidecar _internal dir found at $INTERNAL_DIR; skipping repair"
            exit 0
          fi

          # Some Python wheels expect hashed libwebp SONAMEs (e.g. libwebp-<hash>.so.7.2.0)
          # that are not always present in the bundled sidecar.
          # Copy concrete files (not symlinks) so linuxdeploy can always resolve them.
          print_needed() {
            if command -v patchelf >/dev/null 2>&1; then
              patchelf --print-needed "$1" 2>/dev/null || true
            elif command -v readelf >/dev/null 2>&1; then
              readelf -d "$1" 2>/dev/null | awk '/NEEDED/{gsub(/\[|\]/,"",$5); print $5}' || true
            fi
          }

          mapfile -t MISSING_WEBP_DEPS < <(
            while IFS= read -r -d '' f; do
              print_needed "$f"
            done < <(find "$INTERNAL_DIR" -type f \( -name '*.so' -o -name '*.so.*' -o -perm -111 \) -print0) \
              | grep -E '^libwebp[^/]*-[[:alnum:]_-]+\.so(\.[0-9]+)*$' \
              | sort -u \
              | while read -r dep; do
                  [ -e "$INTERNAL_DIR/$dep" ] || echo "$dep"
                done
          )

          if [ "${#MISSING_WEBP_DEPS[@]}" -eq 0 ]; then
            echo "No missing hashed libwebp dependencies detected"
            exit 0
          fi

          for dep in "${MISSING_WEBP_DEPS[@]}"; do
            case "$dep" in
              libwebpdemux-*.so*) SYS_LIB=$(ldconfig -p | awk '/libwebpdemux\.so\./{print $4; exit}') ;;
              libwebpmux-*.so*)   SYS_LIB=$(ldconfig -p | awk '/libwebpmux\.so\./{print $4; exit}') ;;
              libwebp-*.so*)      SYS_LIB=$(ldconfig -p | awk '/libwebp\.so\./{print $4; exit}') ;;
              *)                  SYS_LIB="" ;;
            esac

            if [ -n "$SYS_LIB" ]; then
              cp -fL "$SYS_LIB" "$INTERNAL_DIR/$dep"
              chmod 0644 "$INTERNAL_DIR/$dep"
              echo "Copied provider for $dep from $SYS_LIB"
            else
              echo "WARNING: no system provider found for $dep"
            fi
          done

          # Hard fallback for the exact SONAME observed in CI logs.
          # Keep this until upstream wheel naming is stable.
          if [ ! -e "$INTERNAL_DIR/libwebp-67ee3789.so.7.2.0" ]; then
            SYS_LIBWEBP=$(ldconfig -p | awk '/libwebp\.so\./{print $4; exit}')
            if [ -n "$SYS_LIBWEBP" ]; then
              cp -fL "$SYS_LIBWEBP" "$INTERNAL_DIR/libwebp-67ee3789.so.7.2.0"
              chmod 0644 "$INTERNAL_DIR/libwebp-67ee3789.so.7.2.0"
              echo "Copied hard fallback libwebp-67ee3789.so.7.2.0 from $SYS_LIBWEBP"
            fi
          fi

      # ── Node.js 20 ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # ── Rust (stable + target triple) ────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Cache compiled Rust crates (cuts ~40% off subsequent build times)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Linux WebKit2GTK (required by Tauri) ─────────────────────────────
      - name: Install WebKit2GTK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update -y

          # Canonical Tauri/Linux build dependencies for Ubuntu 22.04.
          # Keep this list minimal and avoid invalid package names that break apt transactions.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            ca-certificates \
            pkg-config \
            patchelf \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-3-bin \
            librsvg2-dev \
            libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin \
            libglib2.0-bin \
            libxdo-dev \
            libfuse2 \
            libzstd1 \
            libgcrypt20 \
            squashfs-tools \
            appstream \
            desktop-file-utils \
            shared-mime-info \
            zsync \
            libxcb1 \
            libxkbcommon0 \
            libstdc++6 \
            libglib2.0-0

          # OpenGL runtime package naming can differ by distro image.
          if apt-cache show libgl1-mesa-glx >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgl1-mesa-glx
          elif apt-cache show libgl1 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgl1
          else
            echo "ERROR: neither libgl1-mesa-glx nor libgl1 is available"
            exit 1
          fi

          # libffi package name differs across Ubuntu versions.
          if apt-cache show libffi8 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libffi8
          elif apt-cache show libffi7 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libffi7
          else
            echo "ERROR: neither libffi8 nor libffi7 is available"
            exit 1
          fi

          # Ubuntu variants may provide either appindicator package name.
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev
          elif apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libappindicator3-dev
          else
            echo "ERROR: neither libayatana-appindicator3-dev nor libappindicator3-dev is available"
            exit 1
          fi

          # On Ubuntu 22.04, gdk-pixbuf-query-loaders is installed to an arch-specific
          # path that is NOT in $PATH. Symlink it so linuxdeploy's GTK plugin can find it.
          GDK_PIXBUF_QUERY=$(find /usr/lib -name 'gdk-pixbuf-query-loaders' -type f 2>/dev/null | head -n1 || true)
          if [ -n "$GDK_PIXBUF_QUERY" ]; then
            sudo ln -sf "$GDK_PIXBUF_QUERY" /usr/local/bin/gdk-pixbuf-query-loaders
            echo "Symlinked gdk-pixbuf-query-loaders -> $GDK_PIXBUF_QUERY"
          else
            echo "ERROR: gdk-pixbuf-query-loaders binary not found anywhere under /usr/lib"
            exit 1
          fi

          # linuxdeploy resolves NEEDED entries via host linker paths while scanning AppDir.
          # Provide compatibility SONAME alias used by some bundled wheels.
          SYS_LIBWEBP=$(ldconfig -p | awk '/libwebp\.so\./{print $4; exit}')
          if [ -n "$SYS_LIBWEBP" ]; then
            sudo ln -sf "$SYS_LIBWEBP" /usr/lib/x86_64-linux-gnu/libwebp-67ee3789.so.7.2.0
            sudo ldconfig
            echo "Linked host compatibility SONAME libwebp-67ee3789.so.7.2.0 -> $SYS_LIBWEBP"
          else
            echo "WARNING: system libwebp provider not found; linuxdeploy may fail on hashed libwebp SONAME"
          fi

          # Verify pkg-config can find required dev packages.
          pkg-config --cflags --libs gtk+-3.0 || (echo "GTK3 dev headers not found" && exit 1)
          pkg-config --cflags --libs webkit2gtk-4.1 || (echo "WebKit2GTK 4.1 dev headers not found" && exit 1)
          command -v glib-compile-schemas >/dev/null || (echo "glib-compile-schemas not found" && exit 1)
          command -v gdk-pixbuf-query-loaders >/dev/null || (echo "gdk-pixbuf-query-loaders not in PATH after symlink" && exit 1)
      
      # ── Tauri CLI (pinned version) ─────────────────────────────────────────

      # ── Build Tauri app ───────────────────────────────────────────────────
      # beforeBuildCommand in tauri.conf.json ("npm --prefix ui run build")
      # builds the Svelte frontend automatically before the Rust compilation.
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          RUST_LOG: tauri_bundler=trace,tauri_cli=debug,linuxdeploy=trace
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/lib:/usr/local/lib:${{ env.LD_LIBRARY_PATH }}
          QT_QPA_PLATFORM: offscreen
          LINUXDEPLOY_OUTPUT_VERSION_FILE: 1
        run: |
          rustc --version
          cargo --version
          npx --yes @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} build --target ${{ matrix.target }} -- --verbose 2>&1

      - name: Diagnose AppImage bundling failure (Linux)
        if: matrix.platform == 'ubuntu-22.04' && failure()
        run: |
          set +e
          echo "=== PATH tools ==="
          command -v linuxdeploy || true
          command -v gdk-pixbuf-query-loaders || true
          command -v glib-compile-schemas || true
          command -v appstreamcli || true

          echo "=== AppImage bundle dir tree ==="
          find src-tauri/target -type d -path "*/bundle/appimage*" -print || true
          find src-tauri/target -type f \( -iname "*linuxdeploy*" -o -iname "*plugin*gtk*" -o -iname "*plugin*appimage*" \) | sed 's#^#FILE: #' || true

          echo "=== Locate linuxdeploy cache artifacts (project + home cache) ==="
          find src-tauri/target -type f \( -iname "*linuxdeploy*" -o -iname "*plugin*gtk*" -o -iname "*plugin*gstreamer*" -o -iname "*plugin*appimage*" \) 2>/dev/null | sed 's#^#TARGET_FILE: #' || true
          find "$HOME" -type f \( -iname "*linuxdeploy*" -o -iname "*plugin*gtk*" -o -iname "*plugin*gstreamer*" -o -iname "*plugin*appimage*" \) 2>/dev/null | sed 's#^#HOME_FILE: #' || true

          echo "=== Inspect linuxdeploy binaries ==="
          while IFS= read -r f; do
            echo "--- $f ---"
            file "$f" || true
            ls -l "$f" || true
          done < <(find src-tauri/target "$HOME" -type f -iname "*linuxdeploy*" 2>/dev/null | head -n 40)

          echo "=== Try direct linuxdeploy rerun for stderr ==="
          APPDIR=$(find src-tauri/target -type d -name "*.AppDir" 2>/dev/null | head -n1)
          LINUXDEPLOY_BIN=$(find src-tauri/target "$HOME" -type f \( -name "linuxdeploy" -o -name "linuxdeploy-*.AppImage" \) 2>/dev/null | head -n1)
          GTK_PLUGIN=$(find src-tauri/target "$HOME" -type f -name "*linuxdeploy-plugin-gtk*.sh" 2>/dev/null | head -n1)
          APPIMAGE_PLUGIN=$(find src-tauri/target "$HOME" -type f -name "*linuxdeploy-plugin-appimage*.AppImage" 2>/dev/null | head -n1)

          echo "APPDIR=$APPDIR"
          echo "LINUXDEPLOY_BIN=$LINUXDEPLOY_BIN"
          echo "GTK_PLUGIN=$GTK_PLUGIN"
          echo "APPIMAGE_PLUGIN=$APPIMAGE_PLUGIN"

          if [ -n "$APPDIR" ] && [ -n "$LINUXDEPLOY_BIN" ]; then
            chmod +x "$LINUXDEPLOY_BIN" || true
            [ -n "$GTK_PLUGIN" ] && chmod +x "$GTK_PLUGIN" || true
            [ -n "$APPIMAGE_PLUGIN" ] && chmod +x "$APPIMAGE_PLUGIN" || true

            if [ -n "$GTK_PLUGIN" ]; then
              export LINUXDEPLOY_PLUGIN_GTK="$GTK_PLUGIN"
            fi
            if [ -n "$APPIMAGE_PLUGIN" ]; then
              export LINUXDEPLOY_PLUGIN_APPIMAGE="$APPIMAGE_PLUGIN"
            fi

            "$LINUXDEPLOY_BIN" --appimage-extract-and-run --verbosity 3 --appdir "$APPDIR" --plugin gtk --output appimage || true
          else
            echo "Could not rerun linuxdeploy: missing AppDir or linuxdeploy binary"
          fi

      - name: Build Tauri app (Windows/macOS)
        if: matrix.platform != 'ubuntu-22.04'
        run: npx --yes @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }} build --target ${{ matrix.target }} -- --verbose 2>&1

      # ── Upload installer as workflow artifact ─────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # ── Create GitHub Release (tag builds only) ─────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
