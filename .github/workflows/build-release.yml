name: Build & Release

# Triggered by version tags (v*) or manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  # ── Per-platform build ──────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Newline-separated globs — upload-artifact supports multiple patterns
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Python 3.12 ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]" pyinstaller

      # ── Tesseract OCR (platform-specific) ───────────────────────────────
      - name: Install Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install tesseract --yes

      - name: Install Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install tesseract

      - name: Install Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      # Copy Tesseract binaries into packaging/ so the spec file can bundle them
      - name: Bundle Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging\tesseract\win   | Out-Null
          New-Item -ItemType Directory -Force -Path packaging\tesseract\tessdata | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe"                  packaging\tesseract\win\
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata"       packaging\tesseract\tessdata\

      - name: Bundle Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p packaging/tesseract/mac packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/mac/
          for SEARCH_PATH in \
              /usr/local/share/tessdata \
              /opt/homebrew/share/tessdata \
              /usr/share/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on macOS"
            exit 1
          fi

      - name: Bundle Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p packaging/tesseract/linux packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/linux/
          for SEARCH_PATH in \
              /usr/share/tessdata \
              /usr/share/tesseract-ocr/5/tessdata \
              /usr/share/tesseract-ocr/4/tessdata \
              /usr/share/tesseract-ocr/tessdata \
              /usr/share/tesseract-ocr/4.00/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            FOUND=$(find /usr -path '*/tessdata/eng.traineddata' -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" packaging/tesseract/tessdata/
            fi
          fi
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on Linux"
            exit 1
          fi

      # ── Build hermes-server sidecar (PyInstaller) ────────────────────────
      - name: Prebuild cleanup (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\stop-dev-processes.ps1

      - name: Build hermes-server (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        # Use system python — venv not present in CI; pip installed into actions python
        run: .\packaging\scripts\build-backend.ps1 -VenvPython python

      - name: Copy hermes-server to Tauri resources (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\copy-backend-to-resources.ps1

      - name: Build hermes-server (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/build-backend.sh

      - name: Copy hermes-server to Tauri resources (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/copy-backend-to-resources.sh

      # ── Node.js 20 ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # ── Rust (stable + target triple) ────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Cache compiled Rust crates (cuts ~40% off subsequent build times)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Linux WebKit2GTK (required by Tauri) ─────────────────────────────
      - name: Install WebKit2GTK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update -y

          # Canonical Tauri/Linux build dependencies for Ubuntu 22.04.
          # Keep this list minimal and avoid invalid package names that break apt transactions.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            ca-certificates \
            pkg-config \
            patchelf \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libfuse2 \
            libzstd1 \
            libgcrypt20 \
            squashfs-tools \
            desktop-file-utils \
            zsync

          # OpenGL runtime package naming can differ by distro image.
          if apt-cache show libgl1-mesa-glx >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgl1-mesa-glx
          elif apt-cache show libgl1 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libgl1
          else
            echo "ERROR: neither libgl1-mesa-glx nor libgl1 is available"
            exit 1
          fi

          # libffi package name differs across Ubuntu versions.
          if apt-cache show libffi8 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libffi8
          elif apt-cache show libffi7 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libffi7
          else
            echo "ERROR: neither libffi8 nor libffi7 is available"
            exit 1
          fi

          # Ubuntu variants may provide either appindicator package name.
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev
          elif apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libappindicator3-dev
          else
            echo "ERROR: neither libayatana-appindicator3-dev nor libappindicator3-dev is available"
            exit 1
          fi

          # Verify pkg-config can find required dev packages.
          pkg-config --cflags --libs gtk+-3.0 || (echo "GTK3 dev headers not found" && exit 1)
          pkg-config --cflags --libs webkit2gtk-4.1 || (echo "WebKit2GTK 4.1 dev headers not found" && exit 1)
          
          # Download linuxdeploy AppImage, extract it once, and install native binary.
          # This avoids AppImage runtime/FUSE quirks in CI.
          for attempt in {1..3}; do
            echo "Download attempt $attempt..."
            wget -v https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy-appimage && break
            if [ $attempt -lt 3 ]; then sleep 5; fi
          done
          
          if [ ! -f linuxdeploy-appimage ]; then
            echo "Failed to download linuxdeploy after 3 attempts"
            exit 1
          fi
          
          chmod +x linuxdeploy-appimage
          rm -rf squashfs-root
          ./linuxdeploy-appimage --appimage-extract >/dev/null

          if [ -f squashfs-root/usr/bin/linuxdeploy ]; then
            sudo install -m 0755 squashfs-root/usr/bin/linuxdeploy /usr/local/bin/linuxdeploy
          elif [ -f squashfs-root/AppRun ]; then
            sudo install -m 0755 squashfs-root/AppRun /usr/local/bin/linuxdeploy
          else
            echo "ERROR: extracted linuxdeploy binary not found"
            exit 1
          fi

          rm -rf linuxdeploy-appimage squashfs-root
          
          # Verify linuxdeploy is executable and diagnose missing dependencies
          echo "Checking linuxdeploy binary..."
          file /usr/local/bin/linuxdeploy
          echo "Checking linuxdeploy runtime dependencies (ldd)..."
          ldd /usr/local/bin/linuxdeploy || echo "Warning: some dependencies may be missing, but continuing..."
          
          # Verify linuxdeploy functionality
          /usr/local/bin/linuxdeploy --version || exit 1

      - name: Install linuxdeploy plugins (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          PLUGIN_DIR="${HOME}/.local/share/linuxdeploy/plugins"
          mkdir -p "$PLUGIN_DIR"

          download_with_retry() {
            local url="$1"
            local out="$2"
            for attempt in {1..3}; do
              if wget -q "$url" -O "$out" && [ -s "$out" ]; then
                chmod +x "$out"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            echo "ERROR: failed to download $url"
            exit 1
          }

          download_with_retry \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" \
            "$PLUGIN_DIR/linuxdeploy-plugin-gtk.sh"

          download_with_retry \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" \
            "$PLUGIN_DIR/linuxdeploy-plugin-gstreamer.sh"

          APPIMAGE_PLUGIN_TMP="/tmp/linuxdeploy-plugin-appimage-x86_64.AppImage"
          APPIMAGE_PLUGIN_EXTRACT_DIR="/tmp/linuxdeploy-plugin-appimage-extract"

          download_with_retry \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
            "$APPIMAGE_PLUGIN_TMP"

          rm -rf "$APPIMAGE_PLUGIN_EXTRACT_DIR"
          mkdir -p "$APPIMAGE_PLUGIN_EXTRACT_DIR"
          (
            cd "$APPIMAGE_PLUGIN_EXTRACT_DIR"
            "$APPIMAGE_PLUGIN_TMP" --appimage-extract >/dev/null
          )

          if [ -f "$APPIMAGE_PLUGIN_EXTRACT_DIR/squashfs-root/usr/bin/linuxdeploy-plugin-appimage" ]; then
            install -m 0755 \
              "$APPIMAGE_PLUGIN_EXTRACT_DIR/squashfs-root/usr/bin/linuxdeploy-plugin-appimage" \
              "$PLUGIN_DIR/linuxdeploy-plugin-appimage"
          elif [ -f "$APPIMAGE_PLUGIN_EXTRACT_DIR/squashfs-root/AppRun" ]; then
            install -m 0755 \
              "$APPIMAGE_PLUGIN_EXTRACT_DIR/squashfs-root/AppRun" \
              "$PLUGIN_DIR/linuxdeploy-plugin-appimage"
          else
            echo "ERROR: extracted linuxdeploy-plugin-appimage binary not found"
            exit 1
          fi

          rm -rf "$APPIMAGE_PLUGIN_TMP" "$APPIMAGE_PLUGIN_EXTRACT_DIR"

          # Provide extension-less command names linuxdeploy expects in PATH.
          ln -sf "$PLUGIN_DIR/linuxdeploy-plugin-gtk.sh" "$PLUGIN_DIR/linuxdeploy-plugin-gtk"
          ln -sf "$PLUGIN_DIR/linuxdeploy-plugin-gstreamer.sh" "$PLUGIN_DIR/linuxdeploy-plugin-gstreamer"

          echo "$PLUGIN_DIR" >> "$GITHUB_PATH"

          # Quick plugin diagnostics.
          ls -la "$PLUGIN_DIR"
          file "$PLUGIN_DIR/linuxdeploy-plugin-appimage" || true
      
      # ── Tauri CLI (pre-built npm binary — faster than cargo install) ──────
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # ── Build Tauri app ───────────────────────────────────────────────────
      # beforeBuildCommand in tauri.conf.json ("npm --prefix ui run build")
      # builds the Svelte frontend automatically before the Rust compilation.
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LINUXDEPLOY_VERBOSE: 1
          LINUXDEPLOY_PLUGIN_DIR: ${{ env.HOME }}/.local/share/linuxdeploy/plugins
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/lib:/usr/local/lib:${{ env.LD_LIBRARY_PATH }}
          QT_QPA_PLATFORM: offscreen
        run: |
          # Verify Rust toolchain is available
          rustc --version
          cargo --version

          # Verify extracted linuxdeploy binary is available
          command -v linuxdeploy
          linuxdeploy --version
          
          # Verify linuxdeploy plugins are in place
          ls -la "$LINUXDEPLOY_PLUGIN_DIR" || true
          
          tauri build --target ${{ matrix.target }} -- --verbose 2>&1

      - name: Build Tauri app (Windows/macOS)
        if: matrix.platform != 'ubuntu-22.04'
        run: tauri build --target ${{ matrix.target }} -- --verbose 2>&1

      # ── Upload installer as workflow artifact ─────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # ── Create GitHub Release (tag builds only) ─────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
