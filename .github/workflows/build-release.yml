name: Build & Release

# Triggered by version tags (v*) or manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  # ── Per-platform build ──────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Newline-separated globs — upload-artifact supports multiple patterns
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Python 3.12 ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]" pyinstaller

      # ── Tesseract OCR (platform-specific) ───────────────────────────────
      - name: Install Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install tesseract --yes

      - name: Install Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install tesseract

      - name: Install Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      # Copy Tesseract binaries into packaging/ so the spec file can bundle them
      - name: Bundle Tesseract (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging\tesseract\win   | Out-Null
          New-Item -ItemType Directory -Force -Path packaging\tesseract\tessdata | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe"                  packaging\tesseract\win\
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata"       packaging\tesseract\tessdata\

      - name: Bundle Tesseract (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p packaging/tesseract/mac packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/mac/
          for SEARCH_PATH in \
              /usr/local/share/tessdata \
              /opt/homebrew/share/tessdata \
              /usr/share/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on macOS"
            exit 1
          fi

      - name: Bundle Tesseract (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p packaging/tesseract/linux packaging/tesseract/tessdata
          cp "$(which tesseract)" packaging/tesseract/linux/
          for SEARCH_PATH in \
              /usr/share/tessdata \
              /usr/share/tesseract-ocr/5/tessdata \
              /usr/share/tesseract-ocr/4/tessdata \
              /usr/share/tesseract-ocr/tessdata \
              /usr/share/tesseract-ocr/4.00/tessdata; do
            if [ -f "$SEARCH_PATH/eng.traineddata" ]; then
              cp "$SEARCH_PATH/eng.traineddata" packaging/tesseract/tessdata/
              break
            fi
          done
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            FOUND=$(find /usr -path '*/tessdata/eng.traineddata' -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" packaging/tesseract/tessdata/
            fi
          fi
          if [ ! -f packaging/tesseract/tessdata/eng.traineddata ]; then
            echo "ERROR: could not find eng.traineddata on Linux"
            exit 1
          fi

      # ── Build hermes-server sidecar (PyInstaller) ────────────────────────
      - name: Prebuild cleanup (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\stop-dev-processes.ps1

      - name: Build hermes-server (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        # Use system python — venv not present in CI; pip installed into actions python
        run: .\packaging\scripts\build-backend.ps1 -VenvPython python

      - name: Copy hermes-server to Tauri resources (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: .\packaging\scripts\copy-backend-to-resources.ps1

      - name: Build hermes-server (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/build-backend.sh

      - name: Copy hermes-server to Tauri resources (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: bash packaging/scripts/copy-backend-to-resources.sh

      # ── Node.js 20 ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # ── Rust (stable + target triple) ────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Cache compiled Rust crates (cuts ~40% off subsequent build times)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Linux WebKit2GTK (required by Tauri) ─────────────────────────────
      - name: Install WebKit2GTK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y  --fix-missing \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgl1-mesa-glx \
            zlib1g-dev || sudo apt-get install -y --fix-broken

      # ── Setup linuxdeploy (Linux) ──────────────────────────────────────
      - name: Setup linuxdeploy (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Install linuxdeploy dependencies
          sudo apt-get update -y
          sudo apt-get install -y \
            libfuse2 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libglib2.0-0 \
            libssl-dev \
            libxcb-randr0 \
            libxcb-xinerama0 \
            libxcb-keysyms1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 || sudo apt-get install -y --fix-broken
          
          # Download and setup linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          if [ ! -f linuxdeploy ]; then
            echo "Failed to download linuxdeploy"
            exit 1
          fi
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/
      
          # Verify linuxdeploy works
          /usr/local/bin/linuxdeploy --version || exit 1

      # ── Tauri CLI (pre-built npm binary — faster than cargo install) ──────
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # ── Build Tauri app ───────────────────────────────────────────────────
      # beforeBuildCommand in tauri.conf.json ("npm --prefix ui run build")
      # builds the Svelte frontend automatically before the Rust compilation.
      - name: Build Tauri app
        run: tauri build --target ${{ matrix.target }} -- --verbose

      # ── Upload installer as workflow artifact ─────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # ── Create GitHub Release (tag builds only) ─────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
