name: Deploy GitHub Pages

# Deploys the docs-site/ directory to GitHub Pages on every push to main
# that touches docs-site/, or on manual trigger.
on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; cancel any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - id: deploy
        uses: actions/deploy-pages@v4
